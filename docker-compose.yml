# ══════════════════════════════════════════════════════════════
# Barista Robot Kiosk — Docker Compose
#
# İki servis, ikisi de host üzerinden ip:port ile erişilir:
#   backend   FastAPI (robot + kahve makinesi + syrup + DB)  → :8000
#   frontend  nginx ile servis edilen kiosk arayüzü          → :8088
#
# HIZLI BAŞLANGIÇ:
#   1. backend/wmf/.env dosyasını hazırlayın (.env.example'dan kopyalayın)
#   2. cp .env.docker.example .env   → SUNUCU_IP ve portları doldurun
#   3. docker compose up -d --build
#
# ⚠️  SUNUCU IP'Sİ ŞART: KIOSK_API_URL "localhost" OLAMAZ. Bu adres
#     kiosk tarayıcısının içine gömülür; tarayıcı sunucunun kendisinde
#     değilse "localhost" kendi makinesini işaret eder ve arayüz
#     backend'e hiç ulaşamaz.
#
# DURDURMA:   docker compose down
# LOGLAR:     docker compose logs -f backend
# ══════════════════════════════════════════════════════════════

services:

  # ────────────────────────────────────────────────────────────
  # BACKEND — FastAPI
  # ────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend/wmf
      dockerfile: Dockerfile
    image: barista-backend:latest
    container_name: barista-backend

    # Sunucu yeniden başladığında konteyner kendiliğinden kalkar.
    # (Docker servisinin de açılışta etkin olması gerekir —
    #  sudo systemctl enable docker)
    restart: unless-stopped

    # Tüm yapılandırma .env dosyasından okunur (MONGO_URI, ROBOT_IP,
    # SYRUP_HOST, ADMIN_TOKEN, CORS_ORIGINS, vb.)
    env_file:
      - ./backend/wmf/.env

    environment:
      # Konteyner varsayılan olarak UTC çalışır; log saatleri sunucununkiyle
      # tutmazsa "dün akşam ne oldu" araştırması zorlaşır.
      TZ: ${TZ:-Europe/Istanbul}

    # Host'un TÜM arayüzlerinde dinler → http://<sunucu-ip>:8000
    ports:
      - "${BACKEND_PORT:-8000}:8000"

    # ── Kalıcı veri ──
    # SQLite veritabanı ve loglar konteyner silinse bile kaybolmasın.
    # Çift-DB tasarımında SQLite operasyonel kayıttır; kalıcı olmalı.
    volumes:
      - backend-data:/app/data
      - backend-logs:/app/logs

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/',timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 40s     # açılış ölçüldü: ortalama 9 sn, en uzun 17 sn
      retries: 3

    # Docker'ın kendi json log dosyası sınırsız büyür. Kiosk 7/24
    # çalıştığı için sınır konmazsa disk zamanla dolar. (Uygulamanın
    # kendi logları /app/logs altında ayrıca döndürülüyor.)
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    # ── DONANIM ERİŞİMİ ──────────────────────────────────────
    # Robot (XML-RPC), kahve makinesi (WebSocket) ve syrup dispenser
    # (TCP) yerel ağdaki cihazlardır. Cihazlara IP ile erişildiği ve
    # host ile aynı LAN'da oldukları sürece varsayılan bridge ağı yeterli.
    #
    # Cihaz keşfi (broadcast/mDNS) gerekiyorsa veya bağlantı kurulamıyorsa
    # "networks" ve "ports" satırlarını silip yerine şunu koyun:
    #     network_mode: host
    # (host modunda port eşlemesi yoktur; uygulama doğrudan :8000'de açılır)
    networks:
      - kiosk-net

  # ────────────────────────────────────────────────────────────
  # FRONTEND — nginx (derlenmiş Vite/React)
  # ────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # ── VİTE DEĞİŞKENLERİ DERLEME ANINDA GÖMÜLÜR ──
      # Kiosk'un tarayıcısı backend'e KENDİ makinesinden erişir; bu yüzden
      # değer "backend" (konteyner adı) DEĞİL, sunucunun LAN adresi olmalı.
      #
      # Değeri değiştirince YENİDEN BUILD gerekir (--build), çünkü Vite
      # bunu çalışma anında değil derlemede gömer. Alternatif:
      # frontend/public/config.js ile derlemesiz değiştirme.
      args:
        VITE_API_URL: ${KIOSK_API_URL:?KIOSK_API_URL tanimlanmali - ornek http://192.168.1.44:8000}
        VITE_ADMIN_TOKEN: ${KIOSK_ADMIN_TOKEN:-}
        VITE_ADMIN_PASSWORD: ${KIOSK_ADMIN_PASSWORD:-wmf2024}
    image: barista-frontend:latest
    container_name: barista-frontend
    restart: unless-stopped

    environment:
      TZ: ${TZ:-Europe/Istanbul}

    # Host'un TÜM arayüzlerinde dinler → http://<sunucu-ip>:8088
    ports:
      - "${FRONTEND_PORT:-8088}:80"

    # Yalnızca BAŞLATMA SIRASI — "servis sağlıklı olana kadar bekle"
    # bilinçli olarak KULLANILMIYOR. Arayüz backend'e ulaşamadığında
    # ekranı açıp kırmızı uyarı şeridi göstermek üzere tasarlandı;
    # sağlık koşulu olsaydı backend bozukken kiosk ekranı hiç açılmaz,
    # personel siyah ekranla kalırdı.
    depends_on:
      - backend

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 4s
      start_period: 10s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - kiosk-net

# ── Ağ ──
networks:
  kiosk-net:
    driver: bridge

# ── Kalıcı hacimler ──
volumes:
  backend-data:
  backend-logs:
