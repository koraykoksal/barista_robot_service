# ══════════════════════════════════════════════════════════════
# Barista Robot Kiosk — Docker Compose
#
# İki servis:
#   backend   FastAPI (robot + kahve makinesi + syrup + DB)  → :8000
#   frontend  nginx ile servis edilen kiosk arayüzü          → :8080
#
# HIZLI BAŞLANGIÇ:
#   1. backend/wmf/.env dosyasını hazırlayın (.env.example'dan kopyalayın)
#   2. Aşağıdaki KIOSK_API_URL'i kiosk'un backend'e erişeceği adrese ayarlayın
#   3. docker compose up -d --build
#
# Arayüz:   http://<host-ip>:8080
# API:      http://<host-ip>:8000
#
# DURDURMA:   docker compose down
# LOGLAR:     docker compose logs -f backend
# ══════════════════════════════════════════════════════════════

services:

  # ────────────────────────────────────────────────────────────
  # BACKEND — FastAPI
  # ────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend/wmf
      dockerfile: Dockerfile
    image: barista-backend:latest
    container_name: barista-backend
    restart: unless-stopped

    # Tüm yapılandırma .env dosyasından okunur (MONGO_URI, ROBOT_IP,
    # SYRUP_HOST, ADMIN_TOKEN, CORS_ORIGINS, vb.)
    env_file:
      - ./backend/wmf/.env

    ports:
      - "8000:8000"

    # ── Kalıcı veri ──
    # SQLite veritabanı ve loglar konteyner silinse bile kaybolmasın.
    # Çift-DB tasarımında SQLite operasyonel kayıttır; kalıcı olmalı.
    volumes:
      - backend-data:/app/data
      - backend-logs:/app/logs

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/',timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

    # ── DONANIM ERİŞİMİ ──────────────────────────────────────
    # Robot (XML-RPC), kahve makinesi (WebSocket) ve syrup dispenser
    # (TCP) yerel ağdaki cihazlardır. Konteynerin bunlara ulaşması için
    # iki seçenek var:
    #
    # SEÇENEK A (varsayılan): bridge ağ + cihaz IP'leri .env'de.
    #   Cihazlar host ile aynı LAN'daysa ve IP ile erişiliyorsa bu yeterli.
    #   Docker NAT üzerinden dışarı çıkışa izin verir.
    #
    # SEÇENEK B: host ağı — konteyner doğrudan host'un ağını kullanır.
    #   Cihaz keşfi (broadcast/mDNS) veya katı ağ kurulumları için gerekir.
    #   Etkinleştirmek için: aşağıdaki "networks" ve "ports" satırlarını
    #   silin, yerine şunu ekleyin:
    #       network_mode: host
    #   (host modunda port eşlemesi yoktur; uygulama doğrudan :8000'de açılır)
    networks:
      - kiosk-net

  # ────────────────────────────────────────────────────────────
  # FRONTEND — nginx (derlenmiş Vite/React)
  # ────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # ── VİTE DEĞİŞKENLERİ DERLEME ANINDA GÖMÜLÜR ──
      # Kiosk'un tarayıcısı backend'e KENDİ makinesinden erişir; bu yüzden
      # değer "backend" (konteyner adı) DEĞİL, kiosk'un ulaşabileceği
      # gerçek adres olmalı — genelde host'un IP'si.
      #
      # Aşağıdaki KIOSK_API_URL'i .env veya kabuk değişkeniyle ayarlayın:
      #   KIOSK_API_URL=http://192.168.1.44:8000 docker compose up --build
      #
      # NOT: Değeri değiştirince frontend'i YENİDEN BUILD etmek gerekir
      # (--build), çünkü Vite bunu çalışma anında değil derlemede gömer.
      # Alternatif: public/config.js dosyasını düzenleyip yeniden derleme
      # olmadan da değiştirebilirsiniz (bkz. README — runtime config).
      args:
        VITE_API_URL: ${KIOSK_API_URL:-http://localhost:8000}
        VITE_ADMIN_TOKEN: ${KIOSK_ADMIN_TOKEN:-}
    image: barista-frontend:latest
    container_name: barista-frontend
    restart: unless-stopped

    ports:
      - "8088:80"

    depends_on:
      backend:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 4s
      start_period: 10s
      retries: 3

    networks:
      - kiosk-net

# ── Ağ ──
networks:
  kiosk-net:
    driver: bridge

# ── Kalıcı hacimler ──
volumes:
  backend-data:
  backend-logs:
