# ══════════════════════════════════════════════════════════════
# Kiosk arayüzü — nginx
#
# NEDEN GEREKLİ:
#   Önceki Dockerfile dist/ klasörünü varsayılan nginx yapılandırmasıyla
#   servis ediyordu. Tek sayfa uygulamasında bu, /stock adresini
#   yenilediğinizde 404 verir: nginx diskte /stock diye bir dosya arar,
#   bulamaz. try_files ile bulunamayan her yol index.html'e düşer ve
#   yönlendirmeyi React Router devralır.
# ══════════════════════════════════════════════════════════════

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashli varlıklar (index-B7wD7kKq.js gibi) içerik değişince
    # ad da değiştiği için uzun süre önbelleğe alınabilir.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html asla önbelleğe alınmamalı — yoksa kiosk eski
    # sürümde takılı kalır ve yeni dağıtımı görmez.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # SPA geri düşüşü
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Sıkıştırma
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Kiosk tarayıcısını gereksiz isteklerden koru
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
}
